<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WE - Beauty Center</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <style>
        :root {
            --card-black: rgba(15, 15, 15, 0.80);
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #aa7c11;
            --text-white: #ffffff;
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-image: url('IMG-9014.WEBP');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.45);
            pointer-events: none;
            z-index: 1;
        }

        .main-container {
            width: 100%;
            max-width: 480px;
            text-align: center;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-container {
            margin-top: 10px;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .center-logo {
            width: 150px;
            height: auto;
            max-height: 150px;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
        }

        .buttons-card {
            width: 100%;
            background: var(--card-black);
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 35px 20px;
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(212, 175, 55, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            gap: 18px;
            margin-bottom: 30px;
        }

        .btn-luxury {
            width: 100%;
            padding: 18px 24px;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: grid;
            grid-template-columns: 30px 1fr 30px; /* تقسيم الزرار لثلاث أقسام لتوسيط النص بدقة */
            align-items: center;
            transition: var(--transition-smooth);
            position: relative;
            overflow: hidden;
            border: none !important;
            outline: none !important;
            -webkit-tap-highlight-color: transparent;
        }

        /* توزيع الأيقونة والنص */
        .btn-luxury svg {
            grid-column: 1;
            width: 22px;
            height: 22px;
            fill: currentColor;
            justify-self: center;
        }

        .btn-text {
            grid-column: 2;
            text-align: center;
        }

        /* زر الجولد الفخم */
        .btn-gold {
            background: linear-gradient(135deg, var(--gold-dark) 0%, var(--gold-primary) 50%, var(--gold-dark) 100%);
            background-size: 200% auto;
            color: #000000;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.2);
        }

        .btn-gold:active, .btn-gold:hover {
            background-position: right center;
            transform: scale(0.98);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
        }

        /* زر الأوتلاين الشفاف */
        .btn-outline-gold {
            background: rgba(20, 20, 20, 0.6);
            color: var(--gold-light);
            border: 1.5px solid var(--gold-primary) !important;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .btn-outline-gold:active, .btn-outline-gold:hover {
            background: rgba(212, 175, 55, 0.15);
            color: var(--text-white);
            border-color: var(--gold-light) !important;
            transform: scale(0.98);
        }

        .brand-phrase {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 1.35rem;
            color: var(--gold-light);
            letter-spacing: 1px;
            margin-top: 10px;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        .brand-phrase::after {
            content: '';
            display: block;
            width: 50px;
            height: 1px;
            background: linear-gradient(to right, transparent, var(--gold-primary), transparent);
            margin: 12px auto 0 auto;
        }
    </style>
</head>
<body>

</body>
